<!DOCTYPE html>
<html lang="es" data-theme="clasico" data-bg="resplandor">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Gaming Store</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="login" data-base="">
  <div id="site-header"></div>
  <main class="container">
    <div class="auth-wrap">
      <div class="panel">
        <div style="text-align: center; margin-bottom: 20px;">
          <h1 style="margin-bottom: 8px;">Bienvenido de nuevo</h1>
          <p class="muted">Ingresa tus datos para acceder a tu biblioteca y ofertas</p>
        </div>
        <div id="formError" class="alert alert-error" hidden></div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="loginEmail">Correo Electrónico</label>
            <input id="loginEmail" type="email" placeholder="tu@correo.com" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="loginPassword">Contraseña</label>
            <input id="loginPassword" type="password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <button class="btn btn-orange btn-block btn-lg" type="submit" style="margin-top: 15px;">Iniciar Sesión</button>
        </form>
        <p class="auth-links" style="text-align: center; margin-top: 20px;">¿Aún no tienes cuenta? <a href="register.html">Crea una aquí</a></p>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/carrito.js"></script>
</body>
</html>
