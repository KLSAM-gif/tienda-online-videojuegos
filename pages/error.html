<!DOCTYPE html>
<html lang="es" data-theme="clasico" data-bg="resplandor">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aviso | Gaming Store</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body data-page="error" data-base="../">
  <div id="site-header"></div>
  <main class="container"><div id="errorPage"></div></main>
  <div id="site-footer"></div>

  <script src="../js/data.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/carrito.js"></script>
  <script>
    /* Pantalla genérica de errores: error.html?code=PAYMENT_DECLINED|OUT_OF_STOCK|UNAVAILABLE|UNAUTHENTICATED|EMPTY_CART|INSUFFICIENT_POINTS|PROCESSING_ERROR */
    (function () {
      var p = GS.util.params();
      var cfg = GS.ui.errorByCode((p.get('code') || '').toUpperCase(), { message: p.get('msg') || '', name: p.get('name') || '' });
      if (!cfg.actions.length) cfg.actions = [
        { label: 'Regresar al carrito', href: GS.url('pages/carrito.html'), kind: 'primary' },
        { label: 'Volver al inicio', href: GS.url('index.html'), kind: 'ghost' }
      ];
      GS.ui.errorPanel(document.getElementById('errorPage'), cfg);
    })();
  </script>
</body>
</html>
