services:
  app:
    build: .
    container_name: gamingstore_app
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: gamingstore_db
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - gamingstore_data:/var/lib/mysql
      - ./database/gamingstore-estructura.sql:/docker-entrypoint-initdb.d/01-estructura.sql:ro

volumes:
  gamingstore_data: